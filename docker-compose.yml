services:
  jekyll:
    image: jekyll/jekyll:latest
    command: jekyll serve --host 0.0.0.0 --watch --force_polling --verbose
    ports:
      - 4000:4000
    # UID/GID del usuario del host para que _site no quede propiedad de root.
    user: "1000:1000"
    environment:
      - JEKYLL_NO_BUNDLER_REQUIRE=true
    volumes:
      - .:/srv/jekyll:z
